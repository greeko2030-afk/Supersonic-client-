name: Android CI (disabled)

# The original PojavLauncher "Android CI" workflow downloaded Java runtimes from an archived
# repository whose artifacts have expired, so it always failed on "Get JRE 8".
# Supersonic builds are done by "Build Supersonic APK" (build-apk.yml).
# This stub only runs when started by hand from the Actions tab.

on:
  workflow_dispatch:

jobs:
  info:
    runs-on: ubuntu-22.04
    steps:
      - name: Use the Supersonic workflow instead
        run: echo "Use the 'Build Supersonic APK' workflow to build the app."
