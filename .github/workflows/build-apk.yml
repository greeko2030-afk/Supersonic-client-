name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies for Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libltdl-dev libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Initialize and Configure buildozer.spec
      run: |
        buildozer init
        
        # Automatically update the default spec file for Supersonic Client
        sed -i 's/title = My Application/title = Supersonic Client/g' buildozer.spec
        sed -i 's/package.name = myapp/package.name = supersonicclient/g' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = com.supersonic/g' buildozer.spec
        sed -i 's/source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas,json/g' buildozer.spec
        
        # Adding basic requirements (excluding customtkinter as it crashes Android builds)
        sed -i 's/requirements = python3,kivy/requirements = python3,requests,pillow/g' buildozer.spec

    - name: Build APK with Buildozer
      run: |
        # yes command is used to auto-accept Android SDK/NDK licenses
        yes | buildozer -v android debug

    - name: Package APK into Zip
      run: |
        zip -j supersonic-client-android.zip bin/*.apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: supersonic-client-apk-zip
        path: supersonic-client-android.zip

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Supersonic Client Latest Build"
        files: supersonic-client-android.zip
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
