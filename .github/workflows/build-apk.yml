name: Build Supersonic APK

on:
  push:
    branches:
      - supersonic-ui
  pull_request:
    branches:
      - supersonic-ui
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        run: |
          apt update && apt install wget
          cd app_pojavlauncher/libs
          wget https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre8
          name: jre8-pojav

      - name: Get JRE17
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-new
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre17-pojav

      - name: Get JRE21
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-21
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre21-pojav

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK with Supersonic UI
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/Supersonic-debug.apk

      - name: Build APK without runtime
        run: |
          rm -r app_pojavlauncher/src/main/assets/components/jre
          rm -r app_pojavlauncher/src/main/assets/components/jre-new
          rm -r app_pojavlauncher/src/main/assets/components/jre-21
          gradle assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/Supersonic-debug-noruntime.apk

      - name: Gen md5sums
        run: |
          md5sum out/Supersonic-debug.apk > out/Supersonic-debug.md5
          md5sum out/Supersonic-debug-noruntime.apk > out/Supersonic-debug-noruntime.md5

      - name: Upload Supersonic APK (with runtime)
        uses: actions/upload-artifact@v4
        with:
          name: Supersonic-APK-with-runtime
          path: out/Supersonic-debug.*

      - name: Upload Supersonic APK (without runtime)
        uses: actions/upload-artifact@v4
        with:
          name: Supersonic-APK-no-runtime
          path: out/Supersonic-debug-noruntime.*

      - name: Create Release Notes
        run: |
          echo "# Supersonic Launcher Build" > out/BUILD_INFO.md
          echo "**Build Date:** $(date)" >> out/BUILD_INFO.md
          echo "**Branch:** supersonic-ui" >> out/BUILD_INFO.md
          echo "**Commit:** $(git rev-parse --short HEAD)" >> out/BUILD_INFO.md
          echo "" >> out/BUILD_INFO.md
          echo "## Files" >> out/BUILD_INFO.md
          echo "- Supersonic-debug.apk (with full JRE)" >> out/BUILD_INFO.md
          echo "- Supersonic-debug-noruntime.apk (without JRE)" >> out/BUILD_INFO.md

      - name: Upload Build Info
        uses: actions/upload-artifact@v4
        with:
          name: Build-Info
          path: out/BUILD_INFO.md
