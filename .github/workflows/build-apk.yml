name: Build Supersonic APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        run: |
          cd app_pojavlauncher/libs
          wget https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      # The old JRE source (PojavLauncherTeam/android-openjdk-build-multiarch) is archived and its
      # CI artifacts have expired, so "Get JRE" failed with "no matching workflow run found".
      # The official Gladiolus release APK already contains JRE 8, 17 and 21, so we take them from there.
      - name: Get Java runtimes (JRE 8 / 17 / 21) from the official release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime_src runtime_extract
          gh release download gladiolus --repo PojavLauncherTeam/PojavLauncher --pattern '*.apk' --dir runtime_src
          ls -lh runtime_src

          RUNTIME_APK=""
          for f in runtime_src/*.apk; do
            if unzip -l "$f" | grep -q 'assets/components/jre-new/'; then
              RUNTIME_APK="$f"
              break
            fi
          done
          if [ -z "$RUNTIME_APK" ]; then
            echo "::error::No APK with bundled Java runtimes was found in the release"
            exit 1
          fi
          echo "Using $RUNTIME_APK"

          # jre-21 may be missing in very old releases, so do not fail on unmatched patterns here
          unzip -q -o "$RUNTIME_APK" 'assets/components/jre/*' 'assets/components/jre-new/*' 'assets/components/jre-21/*' -d runtime_extract || true

          for d in jre jre-new jre-21; do
            if [ -d "runtime_extract/assets/components/$d" ]; then
              mkdir -p "app_pojavlauncher/src/main/assets/components/$d"
              cp -r "runtime_extract/assets/components/$d/." "app_pojavlauncher/src/main/assets/components/$d/"
              echo "Installed $d"
            else
              echo "::warning::$d was not found in the release APK"
            fi
          done

          test -d app_pojavlauncher/src/main/assets/components/jre
          test -d app_pojavlauncher/src/main/assets/components/jre-new
          rm -rf runtime_src runtime_extract

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK with Supersonic UI
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/Supersonic-debug.apk

      - name: Build APK without runtime
        run: |
          rm -rf app_pojavlauncher/src/main/assets/components/jre
          rm -rf app_pojavlauncher/src/main/assets/components/jre-new
          rm -rf app_pojavlauncher/src/main/assets/components/jre-21
          gradle assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/Supersonic-debug-noruntime.apk

      - name: Gen md5sums
        run: |
          md5sum out/Supersonic-debug.apk > out/Supersonic-debug.md5
          md5sum out/Supersonic-debug-noruntime.apk > out/Supersonic-debug-noruntime.md5

      - name: Upload Supersonic APK (with runtime)
        uses: actions/upload-artifact@v4
        with:
          name: Supersonic-APK-with-runtime
          path: out/Supersonic-debug.*

      - name: Upload Supersonic APK (without runtime)
        uses: actions/upload-artifact@v4
        with:
          name: Supersonic-APK-no-runtime
          path: out/Supersonic-debug-noruntime.*

      - name: Create Release Notes
        run: |
          echo "# Supersonic Launcher Build" > out/BUILD_INFO.md
          echo "**Build Date:** $(date)" >> out/BUILD_INFO.md
          echo "**Branch:** ${{ github.ref_name }}" >> out/BUILD_INFO.md
          echo "**Commit:** $(git rev-parse --short HEAD)" >> out/BUILD_INFO.md
          echo "" >> out/BUILD_INFO.md
          echo "## Files" >> out/BUILD_INFO.md
          echo "- Supersonic-debug.apk (with full JRE)" >> out/BUILD_INFO.md
          echo "- Supersonic-debug-noruntime.apk (without JRE)" >> out/BUILD_INFO.md

      - name: Upload Build Info
        uses: actions/upload-artifact@v4
        with:
          name: Build-Info
          path: out/BUILD_INFO.md
      - name: Create GitHub Release and Upload
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: "Auto Build #${{ github.run_number }}"
          body: "Automated build generated by GitHub Actions with Mesa3D D3D12 translation layer."
          files: Output/*.apk
